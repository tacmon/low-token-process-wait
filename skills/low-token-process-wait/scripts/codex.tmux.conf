# Preserve user configuration, then tune only the dedicated Codex server.
source-file -q ~/.tmux.conf
set -g mouse on
set -g status off
set -g history-limit 100000
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-256color:RGB:clipboard,wezterm:RGB:clipboard'
set -g set-clipboard on
set -g focus-events on
set -s escape-time 10
# Preserve Ctrl+B for the application; tabs/panes remain WezTerm controls.
set -g prefix None
# A normal CLI exit should return to the outer zsh rather than leave a dead pane.
set -g remain-on-exit off
set -g detach-on-destroy on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
